<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arco</title>
    <script type="module">
      if (import.meta.env.DEV) {
        document.title = '(DEV) Arco'
      }
      // Stamp the platform before React mounts, so the rounded-corner CSS on
      // macOS does not flash an opaque background on the first paint. App.tsx
      // confirms it afterwards. See reset.css.
      document.documentElement.dataset.platform = /Macintosh|Mac OS X/i.test(navigator.userAgent)
        ? 'macos'
        : 'other'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
