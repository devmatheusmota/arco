# Packaging for Arco. The Tauri bundle in src-tauri/ is the previous shell and
# is not built from here.
appId: com.mota.arco
# node-pty ships prebuilt binaries for Node's ABI and the PTY host runs under
# the system Node, so there is nothing to rebuild for Electron here.
npmRebuild: false
productName: Arco
artifactName: Arco-${version}.${ext}
deb:
  # Debian tooling keys off the file name: dpkg-scanpackages only sees a package
  # named `name_version_arch.deb`.
  artifactName: ${name}_${version}_${arch}.${ext}
directories:
  output: dist-electron
  buildResources: src-tauri/icons
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  # The PTY and speech hosts run under the system Node, which cannot read inside
  # an asar, so they and their native dependencies stay on disk.
  - 'electron/**'
  - '**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**'
  - '**/node_modules/sherpa-onnx-*/**'
linux:
  target:
    - AppImage
    - deb
  syncDesktopName: true
  executableName: arco
  maintainer: Matheus Mota <devmatheusmota@gmail.com>
  synopsis: Reveal the state of every agent, shell, and project
  description: |
    Organizes, operates and resumes multiple coding agents and shells in
    parallel, inside a persistent workspace with real terminals.
  category: Development
  icon: src-tauri/icons

win:
  # Unsigned: there is no code-signing certificate here, so SmartScreen will
  # warn on first run. Signing needs a certificate the project does not hold.
  target:
    - nsis
  icon: src-tauri/icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Arco-${version}-setup.${ext}
mac:
  # `identity: null` builds without signing rather than failing on a missing
  # certificate. Gatekeeper blocks the first launch until it is allowed through
  # System Settings.
  target:
    - dmg
    - zip
  icon: src-tauri/icons/icon.icns
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
