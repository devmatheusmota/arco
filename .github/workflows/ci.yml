name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando um novo chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # vitest run — suíte única, todo teste vive colocado como src/**/*.test.ts.
      - name: Run unit tests
        run: npm test

      # `npm run build` = tsc (typecheck) + vite build. Falha se houver erro de tipo.
      - name: Typecheck and build
        run: npm run build

  smoke:
    # Nothing else here runs the app. Lint, vitest and `tsc && vite build` all
    # pass with the Electron main process fatally broken, because none of them
    # load it — which is exactly how v2.0.1 shipped an app that could not open.
    # ubuntu-22.04 for the same reason the rust job uses it: predictable package
    # names for the libraries Chromium needs.
    name: Boot smoke (Electron)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 \
            libxss1 libxtst6

      # The app loads the built frontend, so there has to be one.
      - name: Build the frontend
        run: npm run build

      - name: Boot the app and check it answers
        run: xvfb-run -a npm run smoke:boot

  rust:
    # src-tauri/ is the previous shell: still compiled so it does not rot, but
    # no longer built or released, so one platform is enough. It used to run on
    # Windows and macOS too, where `git_control`'s tests fail on line endings —
    # a legacy-only failure that told nobody anything about the app that ships.
    name: Rust check (legacy shell)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      # Não-bloqueante por enquanto: já há ~37 warnings pré-existentes no
      # código atual (nenhum deles deste PR). Endurecer pra `-D warnings`
      # depois de uma limpeza dedicada, não junto de outra tarefa.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
