name: Release

on:
  # A tag does NOT trigger a release. `npm run release` only marks the version
  # in git; publishing the installers is a deliberate action, through
  # `npm run release:publish` (gh workflow run) or Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: Build Linux x64
    # The app runs on Electron; the packaged AppImage and .deb come from
    # electron-builder. Windows and macOS are not built here yet: the terminal
    # and speech hosts run under the system Node, and that path is only
    # validated on Linux. Publishing an untested installer would be worse than
    # publishing none.
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, i18n validation and tests
        run: |
          npm run build
          npm test

      - name: Package
        run: npx electron-builder --config electron-builder.yml --linux AppImage deb

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          notes=$(cat <<'BODY'
          Desktop build of Arco for Linux.

          `.AppImage` runs as-is (`chmod +x` then launch); `.deb` installs through the
          package manager.

          **Requires Node.js 20+ on the machine.** Terminals and voice dictation run in
          their own Node processes, because their native bindings target Node's ABI.

          Voice dictation downloads its model on first use, from Preferences.

          Arco is a fork of [Alethe](https://github.com/Kc1t/alethe-agents),
          AGPL-3.0-or-later. Source: this repository.
          BODY
          )
          # Re-runnable: attach to the tag's release when it already exists.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist-electron/*.AppImage dist-electron/*.deb --clobber
          else
            gh release create "v${VERSION}" dist-electron/*.AppImage dist-electron/*.deb \
              --title "Arco v${VERSION}" --notes "${notes}"
          fi
