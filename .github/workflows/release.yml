name: Release

on:
  # A tag does NOT trigger a release. `npm run release` only marks the version
  # in git; publishing the installers is a deliberate action, through
  # `npm run release:publish` (gh workflow run) or Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    # Its own job, not a matrix entry, because the publish below depends on this
    # one alone: the .deb feeds the apt repository, and waiting for the other
    # platforms would hold back the update everyone actually installs.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, i18n validation and tests
        run: |
          npm run build
          npm test

      - name: Package
        # `--publish never`: electron-builder detects CI and would otherwise try
        # to publish the artifacts itself, which needs a token it has no reason
        # to hold — the publish job below does the upload.
        run: npx electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Collect installers
        run: |
          mkdir -p upload
          cp dist-electron/*.AppImage dist-electron/*.deb upload/
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux-x64
          path: upload/*
          if-no-files-found: error

  build-desktop:
    name: Build ${{ matrix.label }}
    # Windows and macOS cannot be cross-built here: the PTY and speech hosts load
    # native bindings, and npm resolves those per platform on install. macOS is
    # split over two runners for the same reason — the Intel build needs an Intel
    # host, and that runner is the one that sits in a queue.
    #
    # Both are packaged unsigned, and both hosts have only ever been exercised on
    # Linux, so treat these installers as unverified until someone runs them.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            targets: --win nsis
            artifacts: windows-x64
          - os: macos-15
            label: macOS arm64
            targets: --mac --arm64
            artifacts: macos-arm64
          # `macos-13` was retired by GitHub: the label resolves to no runner, so
          # the job sat queued forever and held the whole run — six releases
          # piled up behind it before anyone looked. `macos-15-intel` is the
          # current x64 image.
          - os: macos-15-intel
            label: macOS x64
            targets: --mac --x64
            artifacts: macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and i18n validation
        # The test suite is platform-independent and already ran on Linux.
        run: npm run build

      - name: Package
        run: npx electron-builder --config electron-builder.yml ${{ matrix.targets }} --publish never

      - name: Collect installers
        # Keeps the blockmaps, unpacked directories and builder metadata out of
        # the release: only what a person downloads is uploaded.
        shell: bash
        run: |
          mkdir -p upload
          find dist-electron -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} upload/ \;
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifacts }}
          path: upload/*
          if-no-files-found: error

      - name: Attach to the release
        # Each platform attaches its own installer as it finishes, so a runner
        # stuck in a queue delays only itself. The release is created by the
        # Linux job; wait for it rather than racing it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if gh release view "v${version}" >/dev/null 2>&1; then
              gh release upload "v${version}" upload/* --clobber
              exit 0
            fi
            echo "release v${version} ainda nao existe; tentativa ${attempt}"
            sleep 20
          done
          echo "release v${version} nao apareceu em 10 minutos" >&2
          exit 1

  publish:
    name: Publish release
    # Linux alone gates this. The apt repository picks up the .deb from here, and
    # a macOS runner sitting in a queue must not delay it.
    needs: build-linux
    runs-on: ubuntu-22.04
    permissions:
      # `contents: write` creates the release, `actions: write` is what lets the
      # last step dispatch the apt-repo workflow — the default GITHUB_TOKEN only
      # gets one when it is asked for. Without it, `gh workflow run` returns
      # HTTP 403 "Resource not accessible by integration".
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-x64
          path: installers

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ls -l installers
          notes=$(cat <<'BODY'
          Desktop build of Arco.

          **Linux** — `.AppImage` runs as-is (`chmod +x` then launch); `.deb` installs
          through the package manager, and the apt repository picks up new versions.

          **Windows** — `.exe` installer. It is unsigned, so SmartScreen warns on first
          run: More info → Run anyway.

          **macOS** — `.dmg` (or `.zip`), arm64 and x64 separately. Unsigned as well, so
          the first launch needs System Settings → Privacy & Security → Open anyway.

          Windows and macOS builds are attached a few minutes after the Linux ones, and
          have not been exercised the way the Linux build has — the terminal and speech
          hosts run under the system Node, and that path was only ever validated on
          Linux.

          **Requires Node.js 20+ on the machine.** Terminals and voice dictation run in
          their own Node processes, because their native bindings target Node's ABI.

          Voice dictation downloads its model on first use, from Preferences.

          Arco is a fork of [Alethe](https://github.com/Kc1t/alethe-agents),
          AGPL-3.0-or-later. Source: this repository.
          BODY
          )
          # Re-runnable: attach to the tag's release when it already exists.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" installers/* --clobber
          else
            gh release create "v${VERSION}" installers/* \
              --title "Arco v${VERSION}" --notes "${notes}"
          fi

      - name: Update the apt repository
        # The apt workflow keys off `workflow_run: completed`, which only fires
        # once every platform is done — including a macOS runner that can sit in
        # a queue for hours. The .deb is ready now, so start it now.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run apt-repo.yml --ref "${GITHUB_REF_NAME}"
