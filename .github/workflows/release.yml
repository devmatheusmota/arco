name: Release

on:
  # A tag does NOT trigger a release. `npm run release` only marks the version
  # in git; publishing the installers is a deliberate action, through
  # `npm run release:publish` (gh workflow run) or Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    # One runner per platform and architecture, because the installers cannot be
    # cross-built here: the PTY and speech hosts load native bindings, and npm
    # resolves those per platform on install. macOS is split over two runners for
    # the same reason — the Intel build needs an Intel host.
    #
    # Windows and macOS are packaged unsigned. Both hosts run under the system
    # Node, and that path has only ever been exercised on Linux, so treat those
    # installers as unverified until someone runs them.
    runs-on: ${{ matrix.os }}
    # Linux is the build that has to work: it feeds the apt repository, and a
    # failure there must stop the publish. Windows and macOS are best-effort
    # until they are exercised, so their failure leaves the rest of the release —
    # and the apt update that follows it — untouched.
    continue-on-error: ${{ matrix.os != 'ubuntu-22.04' }}
    strategy:
      # One platform failing should not throw away the installers that did build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            targets: --linux AppImage deb
            artifacts: linux-x64
            test: true
          - os: windows-latest
            label: Windows x64
            targets: --win nsis
            artifacts: windows-x64
            test: false
          - os: macos-14
            label: macOS arm64
            targets: --mac --arm64
            artifacts: macos-arm64
            test: false
          - os: macos-13
            label: macOS x64
            targets: --mac --x64
            artifacts: macos-x64
            test: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and i18n validation
        run: npm run build

      - name: Tests
        # The suite is platform-independent; running it four times would only
        # cost minutes.
        if: matrix.test
        run: npm test

      - name: Package
        # `--publish never`: electron-builder detects CI and would otherwise try
        # to publish the artifacts itself, which needs a token it has no reason
        # to hold — the release job below does the upload.
        run: npx electron-builder --config electron-builder.yml ${{ matrix.targets }} --publish never

      - name: Collect installers
        # Keeps the blockmaps, unpacked directories and builder metadata out of
        # the release: only what a person downloads is uploaded.
        shell: bash
        run: |
          mkdir -p upload
          find dist-electron -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} upload/ \;
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifacts }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Runs even when a platform failed, so the installers that did build are
    # still published; it stops only if nothing was produced at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ls -l installers
          notes=$(cat <<'BODY'
          Desktop build of Arco.

          **Linux** — `.AppImage` runs as-is (`chmod +x` then launch); `.deb` installs
          through the package manager, and the apt repository picks up new versions.

          **Windows** — `.exe` installer. It is unsigned, so SmartScreen warns on first
          run: More info → Run anyway.

          **macOS** — `.dmg` (or `.zip`), arm64 and x64 separately. Unsigned as well, so
          the first launch needs System Settings → Privacy & Security → Open anyway.

          Windows and macOS builds are new here and have not been exercised the way the
          Linux one has — the terminal and speech hosts run under the system Node, and
          that path was only ever validated on Linux.

          **Requires Node.js 20+ on the machine.** Terminals and voice dictation run in
          their own Node processes, because their native bindings target Node's ABI.

          Voice dictation downloads its model on first use, from Preferences.

          Arco is a fork of [Alethe](https://github.com/Kc1t/alethe-agents),
          AGPL-3.0-or-later. Source: this repository.
          BODY
          )
          # Re-runnable: attach to the tag's release when it already exists.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" installers/* --clobber
          else
            gh release create "v${VERSION}" installers/* \
              --title "Arco v${VERSION}" --notes "${notes}"
          fi
