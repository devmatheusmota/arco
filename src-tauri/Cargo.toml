[package]
name = "arco"
version = "2.13.6"
description = "Arco — terminal multiplexer GUI"
authors = ["Kauã Miguel"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "arco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# ghostty_linked é um cfg custom (ligado só quando o backend nativo Ghostty é
# linkado no build, ver build.rs) — sem isso o compilador avisa "unexpected
# cfg" toda vez que aparece em #[cfg(...)] (lib.rs, ghostty_bridge.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ghostty_linked)"] }

[features]
# Sem esta feature, `tauri-build` liga o cfg `dev` e a WebView vai buscar o
# `devUrl` (http://localhost:1422) em vez do frontend embutido — um
# `cargo build --release` puro gera um binário que abre em branco com
# "Connection refused". O `tauri build` já passa a feature; declará-la aqui faz
# `cargo build --release --features custom-protocol` concordar com ele.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
nanoid = "0.4"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a round-tripped Value in file order. Without it, rewriting one
# key of ~/.claude.json would alphabetise its other 80+ top-level keys.
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "process", "io-util", "macros"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
which = "6"
zip = "0.6"
sysinfo = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tiny_http = "0.12"
# keyring v3 não habilita NENHUM backend de plataforma por padrão — sem uma
# feature explícita ele usa um store mock e todo get_password() falha. Os
# backends nativos são declarados por plataforma abaixo (macos/windows/linux).
keyring = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs-next = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
urlencoding = "2"
dotenvy = "0.15"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
# toml_edit, not toml: it preserves comments, key order and formatting, which is
# required to change one `[mcp_servers.*]` table inside a user's ~/.codex/config.toml
# without rewriting the credentials, hooks and project tables around it.
toml_edit = "0.22"
sherpa-onnx = "1.13.5"
cpal = "0.15"
sha2 = "0.11.0"

# Impede execuções paralelas do Arco (pré-requisito da guarda de
# monotonicidade de `save_projects` em projects.rs). Só compila em desktop —
# a crate não suporta mobile.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Dependências só-macOS para o bridge nativo do Ghostty (embutir surfaces de
# terminal numa NSView sobre a WebView do Tauri). Versões alinhadas com as que
# o Tauri 2.11 já traz na árvore, pra não duplicar.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Backend do Keychain (onde o Claude Code guarda o token OAuth no macOS).
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Dependências só-Windows (registro + Win32). Em Linux/macOS o `winreg` nem
# compila, então ficam atrás de `cfg(windows)`; o código que as usa já é gated.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Backend do Windows Credential Manager.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Backend do Secret Service (GNOME Keyring / KWallet) no Linux. A variante
# `sync-secret-service` + `crypto-rust` não precisa de tokio nem de libs de
# sistema pra criptografia da sessão D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# Em dev, unwind permite que um panic de comando vire Err em vez de derrubar o
# app inteiro durante uma sessão de HMR. Release segue abort (binário menor).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "s"
strip = true
